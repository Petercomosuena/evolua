<script>

const STORE='EVOLUA_DATA_V2',UISTORE='EVOLUA_UI_V2';
const PERIODS=['Evaluación inicial','Primera evaluación','Segunda evaluación','Tercera evaluación','Evaluación final'];
const PERIOD_SHORT=['Inicial','1.ª evaluación','2.ª evaluación','3.ª evaluación','Final'];
const COLORS=['#48688e','#8c659d','#b77a39','#47877b','#b95b5b','#728b44','#b46f91','#536b87','#9b7446','#546f6a','#6674aa','#ab6549'];
const BASE=[{name:'No realizado',scores:[0],color:'#777f87'},{name:'Insuficiente',scores:[1,2,3,4],color:'#b94c4c'},{name:'Suficiente',scores:[5,6],color:'#d78a39'},{name:'Notable',scores:[7,8],color:'#477da0'},{name:'Excelente',scores:[9,10],color:'#75549a'}];
const BUILTIN_4PDC=[{"key":"Historia|4PDC|1.1","number":"1.1","shortTitle":"Síntesis cronológica y terminología histórica","title":"Construir un relato o una síntesis, cronológicamente ordenada, coherente y empleando la terminología adecuada, sobre hechos, procesos y personajes relevantes del pasado y su relación con el presente.","ce":"CE1","block":"CE1 · Tiempo, espacio y evolución histórica","ceDescription":"Tiempo, espacio y evolución histórica","subject":"Historia","course":"4.º PDC","explanation":"Ordena hechos en una línea del tiempo y explica qué ocurrió, con vocabulario histórico y sin saltar de época.","levels":["No entrega la síntesis ni participa en las tareas de ordenación cronológica.","Desordena épocas y siglos de forma grave; confunde causas con consecuencias y no usa vocabulario histórico básico.","Ordena hechos y etapas principales siguiendo un eje o plantilla temporal básica; redacta un resumen comprensible aunque con léxico común.","Construye un relato cronológico claro y coherente, utilizando términos históricos con propiedad y conectando el pasado con rasgos del presente.","Elabora una síntesis diacrónica rigurosa y fluida; maneja la periodización con precisión conceptual experta y analiza el impacto directo en el mundo actual."],"improvements":[["Completa una actividad breve de ordenación o contextualización."],["Sitúa los datos esenciales y revisa los errores de época o contexto."],["Explica las relaciones históricas con un ejemplo propio y sin plantilla."],["Contrasta otro caso y justifica la interpretación con datos concretos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|1.2","number":"1.2","shortTitle":"Relevancia histórica de los hechos","title":"Aportar posibles motivos sobre la distinta relevancia otorgada a unos hechos históricos sobre otros en diferentes momentos del pasado y en el presente.","ce":"CE1","block":"CE1 · Tiempo, espacio y evolución histórica","ceDescription":"Tiempo, espacio y evolución histórica","subject":"Historia","course":"4.º PDC","explanation":"Explica por qué un acontecimiento se considera importante en una época y puede recibir menos atención en otra.","levels":["No realiza la reflexión sobre la importancia o memoria de los acontecimientos históricos.","Considera que la historia es una lista neutra de fechas; no entiende por qué unos hechos se recuerdan y otros se olvidan.","Identifica por qué un hecho fue relevante para sus contemporáneos cuando se le orienta con preguntas guía.","Explica con criterio por qué cambia la importancia de un suceso a lo largo del tiempo según los intereses políticos, sociales o culturales de cada época.","Analiza críticamente la construcción de la memoria histórica y la historiografía; argumenta cómo el poder o los cambios de valores rescatan u ocultan procesos del pasado."],"improvements":[["Completa una actividad breve de ordenación o contextualización."],["Sitúa los datos esenciales y revisa los errores de época o contexto."],["Explica las relaciones históricas con un ejemplo propio y sin plantilla."],["Contrasta otro caso y justifica la interpretación con datos concretos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|1.3","number":"1.3","shortTitle":"Debate sobre intolerancia y fomento del respeto","title":"Debatir sobre situaciones históricas de intolerancia y formular argumentos que fomenten la tolerancia y el respeto hacia la diversidad histórica y cultural de las sociedades humanas.","ce":"CE1","block":"CE1 · Tiempo, espacio y evolución histórica","ceDescription":"Tiempo, espacio y evolución histórica","subject":"Historia","course":"4.º PDC","explanation":"En un debate sobre un episodio histórico, reconoce situaciones de intolerancia y defiende el respeto con argumentos.","levels":["No participa en los debates sobre intolerancia ni entrega argumentos escritos.","Justifica la persecución, el racismo o la intolerancia histórica, o los califica como hechos inevitables sin análisis crítico.","Reconoce situaciones históricas de intolerancia (persecuciones, esclavitud, totalitarismos) y expresa rechazo básico con argumentos sencillos.","Debate de forma fundamentada, denunciando los abusos del pasado y aportando argumentos sólidos que defienden la diversidad y la convivencia.","Desmonta con rigor histórico los mecanismos de la intolerancia y el odio; conecta los errores del pasado con amenazas presentes y lidera el debate en favor de los derechos humanos."],"improvements":[["Participa en una intervención breve respetando las pautas básicas."],["Escucha las opiniones del resto y respeta los turnos al responder."],["Formula preguntas, aporta argumentos y busca acuerdos de forma autónoma."],["Resume posiciones distintas y propone soluciones razonadas ante desacuerdos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|2.1","number":"2.1","shortTitle":"Contraste de fuentes y verificación","title":"Contrastar la información seleccionada para comprender hechos históricos, geográficos y artísticos procedente de diferentes fuentes con la proveniente de organismos oficiales o emisores de reconocido prestigio.","ce":"CE2","block":"CE2 · Trabajo con fuentes documentales e investigación","ceDescription":"Trabajo con fuentes documentales e investigación","subject":"Historia","course":"4.º PDC","explanation":"Comprueba una información en varias fuentes y explica por qué unas resultan más fiables que otras.","levels":["No aporta fuentes ni realiza la comparación documental.","Acepta datos falsos o de webs dudosas sin contrastar nada; no distingue una fuente de rigor de un blog anónimo.","Comprueba si dos fuentes dicen lo mismo siguiendo pautas y acude a documentos o páginas oficiales indicadas por el profesor.","Contrasta de forma autónoma varias fuentes, identificando coincidencias o discrepancias y priorizando emisores fiables o académicos.","Aplica un método de verificación heurístico riguroso; evalúa la solvencia institucional del emisor, detecta omisiones y calibra la validez del testimonio."],"i izar la información contenida en diferentes fuentes documentales para explicar hechos históricos, geográficos y artísticos relacionándolos con su época.","ce":"CE2","block":"CE2 · Trabajo con fuentes documentales e investigación","ceDescription":"Trabajo con fuentes documentales e investigación","subject":"Historia","course":"4.º PDC","explanation":"Utiliza un mapa, texto o imagen histórica para explicar un hecho situándolo correctamente en su época.","levels":["No utiliza las fuentes proporcionadas para redactar las explicaciones.","Cita fragmentos sin entenderlos o comete anacronismos graves (juzgar el pasado con normas actuales sin contextualizar).","Extrae información textual básica de una fuente primaria y la asocia a su época con ayuda de preguntas directas.","Utiliza testimonios, mapas, textos o gráficos para explicar un proceso histórico, relacionando el documento con las circunstancias de su tiempo.","Integra múltiples fuentes primarias y secundarias con maestría, interpretando la intencionalidad del autor y la mentalidad de la época para sustentar su explicación."],"improvements":[["Analiza una fuente breve siguiendo tres preguntas sencillas."],["Distingue hechos y opiniones y comprueba de dónde procede la información."],["Compara al menos dos fuentes y justifica cuál resulta más fiable."],["Identifica sesgos o contradicciones y defiende una conclusión con evidencias."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|2.4","number":"2.4","shortTitle":"Comunicación de conclusiones y metodología","title":"Formular y comunicar de forma textual, gráfica o audiovisual conclusiones y valoraciones propias sobre hechos históricos, geográficos y artísticos, mostrando un dominio adecuado de los conceptos y la metodología de trabajo.","ce":"CE2","block":"CE2 · Trabajo con fuentes documentales e investigación","ceDescription":"Trabajo con fuentes documentales e investigación","subject":"Historia","course":"4.º PDC","explanation":"Presenta una conclusión propia, oralmente o por escrito, apoyada en datos y bien organizada.","levels":["No presenta conclusiones ni comunica el trabajo solicitado.","Presenta ideas inconexas sin base documental; no aporta conclusiones o copia directamente de internet sin elaborar.","Comunica conclusiones sencillas en formato texto o esquema visual, empleando el vocabulario elemental de la materia.","Elabora y expone conclusiones bien estructuradas, combinando texto y gráficos con rigor conceptual y método ordenado.","Transmite conclusiones maduras, originales y sólidamente argumentadas en soportes diversos; demuestra un dominio impecable del método de indagación social."],"improvements":[["Realiza la actividad básica con una pauta clara."],["Identifica los errores principales y corrígelos con un ejemplo."],["Repite la tarea de forma autónoma y explica por qué has elegido esa solución."],["Compara dos ejemplos y justifica tu respuesta con evidencias."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|3.1","number":"3.1","shortTitle":"Explicación causal compleja de procesos históricos","title":"Explicar las dinámicas de cambio y continuidad en los procesos históricos más relevantes de diferentes épocas identificando relaciones causales complejas y entre factores.","ce":"CE3","block":"CE3 · Causalidad, cambio y continuidad","ceDescription":"Causalidad, cambio y continuidad","subject":"Historia","course":"4.º PDC","explanation":"Explica varias causas y consecuencias de un proceso histórico y distingue qué cambió y qué permaneció.","levels":["No entrega la explicación causal ni los esquemas de cambio/continuidad.","Atribuye procesos históricos a una única causa simplista o fortuita; es incapaz de identificar qué cambió y qué permaneció.","Identifica al menos dos causas (económicas, políticas o sociales) y señala un cambio evidente tras el proceso histórico analizado.","Explica la multicausalidad de los procesos históricos, diferenciando factores de fondo de los detonantes inmediatos y reconociendo continuidades.","Analiza con brillantez la interdependencia de factores causales (estructuras materiales, ideologías, crisis) y articula la dialéctica de permanencia y cambio."],"improvements":[["Completa una actividad breve de ordenación o contextualización."],["Sitúa los datos esenciales y revisa los errores de época o contexto."],["Explica las relaciones históricas con un ejemplo propio y sin plantilla."],["Contrasta otro caso y justifica la interpretación con datos concretos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|3.2","number":"3.2","shortTitle":"Contextualización de decisiones y acciones del pasado","title":"Contextualizar y valorar decisiones tomadas por personas del pasado y/o de contextos sociales, políticos y culturales distintos al propio, y debatir sobre los motivos de sus acciones.","ce":"CE3","block":"CE3 · Causalidad, cambio y continuidad","ceDescription":"Causalidad, cambio y continuidad","subject":"Historia","course":"4.º PDC","explanation":"Explica por qué una persona del pasado pudo tomar una decisión atendiendo a las circunstancias de su época.","levels":["No participa en el análisis de decisiones históricas ni en los debates.","Juzga a personajes del pasado con insultos o simplificaciones, sin entender los condicionantes materiales o ideológicos de su época.","Explica los motivos básicos que llevaron a un personaje o colectivo a actuar, apoyándose en explicaciones del profesor.","Contextualiza con empatía histórica las decisiones de los protagonistas del pasado, debatiendo sobre sus opciones y dilemas reales.","Examina con agudeza el margen de acción, las contradicciones morales y las presiones políticas/sociales de los agentes históricos en su contexto."],"improvements":[["Completa una actividad breve de ordenación o contextualización."],["Sitúa los datos esenciales y revisa los errores de época o contexto."],["Explica las relaciones históricas con un ejemplo propio y sin plantilla."],["Contrasta otro caso y justifica la interpretación con datos concretos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|3.3","number":"3.3","shortTitle":"Juicios de valor y tolerancia hacia otras cosmovisiones","title":"Producir opiniones y juicios de valor coherentes sobre cuestiones sociales y políticas del pasado y del presente, manifestando actitudes de tolerancia, respeto e interés hacia otras culturas y cosmovisiones.","ce":"CE3","block":"CE3 · Causalidad, cambio y continuidad","ceDescription":"Causalidad, cambio y continuidad","subject":"Historia","course":"4.º PDC","explanation":"Opina sobre un problema histórico o actual con argumentos, respetando puntos de vista culturales distintos.","levels":["No expresa opiniones fundamentadas o muestra rechazo abierto a la actividad.","Emite juicios intolerantes o despectivos hacia otras culturas, manifestando etnocentrismo sin argumentación.","Expresa opiniones respetuosas sobre problemas sociales y culturales, manteniendo una postura tolerante aunque con argumentos básicos.","Formula juicios de valor bien razonados sobre asuntos sociales y políticos, valorando la riqueza de cosmovisiones distintas a la propia.","Argumenta con madurez ética y perspectiva intercultural, combinando la defensa firme de los derechos humanos con el respeto riguroso a la diversidad cultural."],"improvements":[["Participa en una intervención breve respetando las pautas básicas."],["Escucha las opiniones del resto y respeta los turnos al responder."],["Formula preguntas, aporta argumentos y busca acuerdos de forma autónoma."],["Resume posiciones distintas y propone soluciones razonadas ante desacuerdos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|4.1","number":"4.1","shortTitle":"Conexión histórica de las identidades actuales","title":"Identificar los elementos definitorios de las identidades individuales y colectivas más significativas del presente estableciendo su conexión con hechos del pasado.","ce":"CE4","block":"CE4 · Identidades, diversidad y convivencia","ceDescription" s de forma autónoma."],["Resume posiciones distintas y propone soluciones razonadas ante desacuerdos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|5.1","number":"5.1","shortTitle":"Conflictos por recursos naturales y medio ambiente","title":"Identificar y describir las interrelaciones entre los grupos y sociedades humanas y el medioambiente que han dado lugar a problemas y conflictos por el acceso a los recursos naturales.","ce":"CE5","block":"CE5 · Espacio físico, economía y sostenibilidad","ceDescription":"Espacio físico, economía y sostenibilidad","subject":"Historia","course":"4.º PDC","explanation":"Describe cómo el uso del agua, la energía u otros recursos provoca conflictos o afecta al entorno.","levels":["No realiza las actividades sobre explotación ambiental o recursos.","Ignora el impacto humano sobre el medio natural; no entiende por qué el control del agua, petróleo o minerales genera guerras o tensiones.","Señala un ejemplo de conflicto por recursos (como el agua o combustibles) y describe un problema ambiental evidente con ayuda.","Explica cómo la explotación humana de la naturaleza genera tensiones geopolíticas y degradación ambiental en casos concretos.","Analiza las relaciones ecológicas y geopolíticas globales; vincula el modelo productivo y de consumo con las disputas estratégicas por recursos críticos."],"improvements":[["Participa en una intervención breve respetando las pautas básicas."],["Escucha las opiniones del resto y respeta los turnos al responder."],["Formula preguntas, aporta argumentos y busca acuerdos de forma autónoma."],["Resume posiciones distintas y propone soluciones razonadas ante desacuerdos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|5.2","number":"5.2","shortTitle":"Causas complejas de problemas territoriales y ambientales","title":"Explicar las causas de problemas y conflictos territoriales y medioambientales, diferenciando y relacionando las distintas variables que intervienen.","ce":"CE5","block":"CE5 · ternativas viables y sostenibles a problemas ambientales, justificando cómo equilibran el cuidado natural y las necesidades sociales.","Elabora propuestas integrales de transición ecológica y desarrollo sostenible, contrastando viabilidad técnica, justicia distributiva e impacto a largo plazo."],"improvements":[["Describe un ejemplo concreto relacionado con el criterio."],["Identifica dos causas o consecuencias con ayuda de una guía."],["Relaciona causas y efectos y propón una respuesta viable."],["Contrasta varios factores y justifica las soluciones con datos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|6.1","number":"6.1","shortTitle":"Descripción de modelos territoriales, políticos y económicos","title":"Describir las principales características de los diferentes modelos de organización territorial, política y económica.","ce":"CE6","block":"CE6 · Modelos de organización y desigualdad","ceDescription":"Modelos de organización y desigualdad","subject":"Historia","course":"4.º PDC","explanation":"Compara sistemas políticos, económicos o territoriales identificando sus características principales.","levels":["No entrega las descripciones ni cuadros comparativos de modelos.","Confunde sistemas políticos y económicos básicos (como capitalismo con democracia, o dictadura con economía de mercado).","Describe rasgos elementales de un sistema democrático frente a uno autoritario, o del mercado libre frente a la economía planificada.","Caracteriza y diferencia con claridad los principales modelos de Estado y sistemas económicos, identificando su estructura territorial.","Compara con precisión analítica sistemas de organización política, económica y espacial (centralistas, federales, liberales, mixtos), dominando la tipología."],"improvements":[["Describe un ejemplo concreto relacionado con el criterio."],["Identifica dos causas o consecuencias con ayuda de una guía."],["Relaciona causas y efectos y propón una respuesta viable."],["Contrasta varios factores y justi es globales y colectivos.","Argumenta con madurez y autoexigencia la corresponsabilidad individual en los desafíos colectivos, promoviendo pautas éticas en su comunidad."],"improvements":[["Describe un ejemplo concreto relacionado con el criterio."],["Identifica dos causas o consecuencias con ayuda de una guía."],["Relaciona causas y efectos y propón una respuesta viable."],["Contrasta varios factores y justifica las soluciones con datos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|7.2","number":"7.2","shortTitle":"Argumentación histórica y geográfica de problemas sociales","title":"Proporcionar argumentos propios, fundamentados en la historia y en la geografía, sobre los problemas sociales más relevantes, reconociendo la incidencia que su resolución tendrá en la mejora las condiciones de vida de las personas.","ce":"CE7","block":"CE7 · Juicio crítico sobre problemas sociales y ODS","ceDescription":"Juicio crítico sobre problemas sociales y ODS","subject":"Historia","course":"4.º PDC","explanation":"Defiende una opinión sobre un problema actual usando datos históricos o geográficos comprobables.","levels":["No aporta argumentos sobre problemas sociales.","Emite quejas superficiales sin base histórica ni geográfica; no comprende cómo la resolución de un problema mejora la vida colectiva.","Utiliza algún dato histórico o mapa aprendido para opinar sobre un problema social actual y señala por qué es bueno resolverlo.","Sustenta su opinión sobre temas sociales (migración, derechos, vivienda) en antecedentes históricos y realidades geográficas contrastadas.","Articula discursos críticos de alto nivel, demostrando cómo la comprensión del pasado y del territorio es indispensable para diseñar mejoras tangibles en la vida humana."],"improvements":[["Completa una actividad breve de ordenación o contextualización."],["Sitúa los datos esenciales y revisa los errores de época o contexto."],["Explica las relaciones históricas con un ejemplo propio y sin plantilla."],["Co ourse":"4.º PDC","explanation":"Asume tareas en un equipo, cumple su responsabilidad y ayuda al resto cuando resulta necesario.","levels":["Se niega a colaborar o boicotea el trabajo del grupo cooperativo.","Elude sus responsabilidades en el equipo; no asume tareas, se distrae y no apoya a los compañeros con dificultades.","Cumple el rol asignado de forma básica tras supervisión docente, colaborando con sus compañeros de forma correcta.","Desempeña distintos roles con autonomía, puntualidad y eficacia, ayudando activamente a los demás con empatía y buen trato.","Lidera y dinamiza el trabajo en equipo con espíritu solidario; equilibra cargas, apoya a quienes se atascan y asegura el éxito colectivo del proyecto."],"improvements":[["Participa en una intervención breve respetando las pautas básicas."],["Escucha las opiniones del resto y respeta los turnos al responder."],["Formula preguntas, aporta argumentos y busca acuerdos de forma autónoma."],["Resume posiciones distintas y propone soluciones razonadas ante desacuerdos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|8.2","number":"8.2","shortTitle":"Denuncia de injusticias y defensa de la inclusión","title":"Denunciar las situaciones injustas y de exclusión, argumentando a favor del diálogo y la inclusión como formas de superarlas.","ce":"CE8","block":"CE8 · Proyectos cooperativos, convivencia y construcción de la UE","ceDescription":"Proyectos cooperativos, convivencia y construcción de la UE","subject":"Historia","course":"4.º PDC","explanation":"Reconoce una injusticia y explica cómo el diálogo o la inclusión pueden contribuir a resolverla.","levels":["Permanece pasivo o se burla ante situaciones de injusticia o exclusión.","Tolera abusos o defiende la exclusión de colectivos vulnerables; recurre a la imposición en lugar de al diálogo.","Señala injusticias evidentes en el aula o sociedad y asume que deben solucionarse mediante el diálogo y la ayuda mutua.","Denuncia con firmeza la marginación y las injusticias sociales, razonando por qué la inclusión y la mediación pacífica benefician a todos.","Defiende la equidad y los derechos de las minorías con argumentos sólidos e inquebrantables; promueve la acogida, el diálogo y la justicia comunitaria."],"improvements":[["Participa en una intervención breve respetando las pautas básicas."],["Escucha las opiniones del resto y respeta los turnos al responder."],["Formula preguntas, aporta argumentos y busca acuerdos de forma autónoma."],["Resume posiciones distintas y propone soluciones razonadas ante desacuerdos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|8.3","number":"8.3","shortTitle":"Principios democráticos y referente de la Unión Europea","title":"Argumentar y aplicar los principios democráticos y el diálogo para plantear la resolución de los conflictos, tanto a nivel cotidiano como a escala global, en especial utilizando el referente de la construcción histórica de la Unión Europea.","ce":"CE8","block":"CE8 · Proyectos cooperativos, convivencia y construcción de la UE","ceDescription":"Proyectos cooperativos, convivencia y construcción de la UE","subject":"Historia","course":"4.º PDC","explanation":"Resuelve desacuerdos mediante propuestas dialogadas y relaciona estos principios con la historia de la UE.","levels":["Rechaza las vías democráticas o desconoce el papel de la Unión Europea.","Apoya el uso de la fuerza o autoritarismo para resolver conflictos; desconoce el origen de la paz europea tras la Segunda Guerra Mundial.","Acepta las reglas democráticas para resolver dudas en el aula y sabe que la UE nació para evitar nuevas guerras en Europa.","Aplica el diálogo y la negociación en desacuerdos cotidianos, tomando la historia de la integración europea como modelo de pacto y paz.","Argumenta con rigor sobre los valores de la democracia y el europeísmo; utiliza el proceso histórico comunitario para proponer soluciones pacíficas a conflictos globales actuales."],"improvements":[["Realiza la actividad básica con una pauta clara."],["Identifica los errores principales y corrígelos con un ejemplo."],["Repite la tarea de forma autónoma y explica por qué has elegido esa solución."],["Compara dos ejemplos y justifica tu respuesta con evidencias."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|9.1","number":"9.1","shortTitle":"Características de bienes patrimoniales y contexto","title":"Identificar las características de los elementos patrimoniales, relacionándolas con estilos artísticos, época histórica y entorno geográfico.","ce":"CE9","block":"CE9 · Patrimonio cultural, natural y memoria histórica","ceDescription":"Patrimonio cultural, natural y memoria histórica","subject":"Historia","course":"4.º PDC","explanation":"Identifica la época, el estilo o las características de un monumento, obra o paisaje y explica su valor.","levels":["No realiza el análisis de obras de arte, monumentos o paisajes patrimoniales.","Incapaz de reconocer el estilo o época de un monumento elemental; no distingue arte antiguo de moderno ni su valor histórico.","Identifica el estilo general (gótico, renacentista, barroco) y época de un monumento o paisaje con la ayuda de fichas visuales.","Describe con precisión elementos arquitectónicos, artísticos o naturales de un bien patrimonial, contextualizándolo en su historia y geografía.","Analiza obras y paisajes con soltura metodológica y estética experta; explica el significado simbólico, social y material del patrimonio en su época."],"improvements":[["Completa una actividad breve de ordenación o contextualización."],["Sitúa los datos esenciales y revisa los errores de época o contexto."],["Explica las relaciones históricas con un ejemplo propio y sin plantilla."],["Contrasta otro caso y justifica la interpretación con datos concretos."],[]],"isBundledDefault":true},{"key":"Historia|4PDC|9.2","number":"9.2","shortTitle":"Propuestas de preservación del patrimonio como bien social","title":"Elaborar y exponer propuestas argumentadas que contribuyan a la preservación del patrimonio y su puesta en valor, y que lo reconozcan como bien social.","ce":"CE9","block":"CE9 · Patrimonio cultural, natural y memoria histórica","ceDescription":"Patrimonio cultural, natural y memoria histórica","subject":"Historia","course":"4.º PDC","explanation":"Propone una medida concreta para conservar y dar a conocer un bien del patrimonio común.","levels":["No entrega propuestas o muestra desinterés absoluto por el cuidado patrimonial.","Minimiza el valor del patrimonio o justifica su destrucción y abandono en favor de intereses comerciales inmediatos.","Propone medidas básicas para cuidar un monumento o paraje local (limpieza, no dañarlo) reconociendo que pertenece a todos.","Elabora y expone propuestas fundamentadas para proteger y difundir el patrimonio local o global como riqueza colectiva y bien social.","Diseña proyectos rigurosos de puesta en valor, conservación y divulgación patrimonial, argumentando su impacto cívico, educativo y social en la comunidad."],"improvements":[["Completa una actividad breve de ordenación o contextualización."],["Sitúa los datos esenciales y revisa los errores de época o contexto."],["Explica las relaciones históricas con un ejemplo propio y sin plantilla."],["Contrasta otro caso y justifica la interpretación con datos concretos."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|1.1","number":"1.1","shortTitle":"Variedades dialectales y lenguas de España","title":"Reconocer y valorar las lenguas de España y las variedades dialectales del español, con atención especial a la del propio territorio, a partir de la explicación de su origen y su desarrollo histórico y sociolingüístico, contrastando aspectos lingüísticos y discursivos y diferenciándolos de rasgos sociolectales y de registro.","ce":"CE1","block":"CE1 · Multilingüismo e interculturalidad","ceDescription":"Multilingüismo e interculturalidad","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":" ectivos hacia determinadas lenguas o acentos. Desconoce los derechos lingüísticos.","Detecta prejuicios lingüísticos explícitos cuando se señalan en el aula y mantiene una actitud receptiva y de respeto básico hacia la diversidad.","Cuestiona y desmonta estereotipos lingüísticos habituales por iniciativa propia, defendiendo la igualdad de valor y dignidad entre todas las lenguas y variedades.","Argumenta de manera crítica contra la discriminación lingüística, vinculando los derechos lingüísticos con la convivencia democrática y formulando propuestas razonadas ante conflictos de contacto de lenguas."],"improvements":[["Analiza una fuente breve siguiendo tres preguntas sencillas."],["Distingue hechos y opiniones y comprueba de dónde procede la información."],["Compara al menos dos fuentes y justifica cuál resulta más fiable."],["Identifica sesgos o contradicciones y defiende una conclusión con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|2.1","number":"2.1","shortTitle":"Sentido global, estructura e intención en la oralidad","title":"Comprender el sentido global, la estructura, la información más relevante y la intención del emisor en textos orales y multimodales de cierta complejidad, analizando la interacción entre los diferentes códigos.","ce":"CE2","block":"CE2 · Comprensión oral y multimodal","ceDescription":"Comprensión oral y multimodal","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Escucha un mensaje, resume la idea principal, reconoce su organización y explica qué pretende comunicar.","levels":["No escucha las grabaciones o intervenciones, o deja los ejercicios de comprensión oral en blanco.","No capta la idea central; extrae datos anecdóticos descontextualizados y yerra al deducir el propósito del hablante.","Extrae el tema general y la intención del emisor tras escuchar con pautas o reescuchas, costándole delimitar las partes del discurso oral.","Comprende de forma autónoma el sentido te breve siguiendo tres preguntas sencillas."],["Distingue hechos y opiniones y comprueba de dónde procede la información."],["Compara al menos dos fuentes y justifica cuál resulta más fiable."],["Identifica sesgos o contradicciones y defiende una conclusión con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|3.1","number":"3.1","shortTitle":"Exposiciones orales formales","title":"Realizar exposiciones y argumentaciones orales con diferente grado de planificación sobre temas de interés personal, social, educativo o profesional, con fluidez, coherencia, cohesión y registro adecuado.","ce":"CE3","block":"CE3 · Producción e interacción oral","ceDescription":"Producción e interacción oral","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Expone un tema con introducción, desarrollo y cierre, sin depender continuamente de leer un guion.","levels":["No realiza la exposición oral programada ni presenta el soporte de apoyo.","Lee de manera mecánica sin contacto visual; discurso inconexo, con titubeos continuos y vocabulario informal inadecuado.","Expone siguiendo un guion básico; se expresa de forma comprensible y mantiene un orden elemental, aunque abusa de muletillas o de la lectura del soporte.","Realiza una exposición fluida y estructurada (introducción, desarrollo y cierre), empleando léxico formal, conectores de discurso y lenguaje no verbal adecuado.","Comunica con seguridad, elocuencia y rigor argumentativo; adapta el tono a la audiencia, domina los tiempos y utiliza recursos visuales de forma impecable como apoyo discursivo."],"improvements":[["Participa en una intervención breve respetando las pautas básicas."],["Escucha las opiniones del resto y respeta los turnos al responder."],["Formula preguntas, aporta argumentos y busca acuerdos de forma autónoma."],["Resume posiciones distintas y propone soluciones razonadas ante desacuerdos."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|3.2","number":"3.2","shortTitle":"Interacción y cooperación conversacional","title":"Participar de manera activa y adecuada en interacciones orales informales, trabajo en equipo y situaciones formales dialogadas, con escucha activa, cooperación conversacional y cortesía lingüística.","ce":"CE3","block":"CE3 · Producción e interacción oral","ceDescription":"Producción e interacción oral","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Escucha las opiniones del resto, respeta los turnos y formula preguntas o aportaciones útiles.","levels":["No participa en los intercambios orales, se aísla en el trabajo en equipo o interrumpe sistemáticamente.","Monopoliza la conversación o se desentiende; no respeta turnos de palabra, desacredita las opiniones ajenas y carece de fórmulas de cortesía.","Interviene en los debates respetando las normas básicas cuando se le modera; colabora de forma receptiva en el equipo y escucha a sus iguales.","Muestra escucha activa constante, respeta los turnos de intervención espontáneamente, formula preguntas pertinentes y aporta argumentos constructivos al grupo.","Dinamiza el diálogo con madurez y empatía; aplica estrategias de cortesía verbal para reorientar discrepancias, sintetizar acuerdos y liderar el trabajo cooperativo."],"improvements":[["Participa en una intervención breve respetando las pautas básicas."],["Escucha las opiniones del resto y respeta los turnos al responder."],["Formula preguntas, aporta argumentos y busca acuerdos de forma autónoma."],["Resume posiciones distintas y propone soluciones razonadas ante desacuerdos."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|4.1","number":"4.1","shortTitle":"Sentido global, estructura e inferencias en lectura","title":"Comprender e interpretar el sentido global, la estructura, la información más relevante y la intención del emisor de textos escritos y multimodales de cierta complejidad, realizando las inferencias necesarias.","ce":"CE4","block":"CE4 · Comprensión escrita y multimodal","ceDescription":"Comprensión escrita y multimodal","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Lee un texto, reconoce sus ideas principales e interpreta información que no aparece expresada literalmente.","levels":["No lee los textos asignados ni cumplimenta los cuestionarios de comprensión escrita.","Incapaz de localizar ideas principales; confunde el tema con ejemplos secundarios y fracasa al deducir cualquier información implícita.","Localiza las ideas explícitas esenciales y reconoce el tema del texto con ayuda de preguntas dirigidas, presentando dificultad en inferencias sutiles.","Comprende la estructura completa del texto escrito, distingue las ideas principales de las secundarias y realiza inferencias directas con acierto y autonomía.","Interpreta en profundidad textos complejos; desentraña segundas intenciones, ironías o matices implícitos y sintetiza con exactitud la tesis central del emisor."],"improvements":[["Realiza una tarea breve de lectura, escritura o análisis lingüístico."],["Identifica la idea principal y revisa los errores con una pauta."],["Organiza y explica las ideas con autonomía y comprueba la corrección."],["Contrasta matices, revisa con precisión y justifica las elecciones realizadas."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|4.2","number":"4.2","shortTitle":"Valoración crítica y análisis de fuentes escritas","title":"Valorar críticamente el contenido y la forma de textos de cierta complejidad evaluando su calidad, fiabilidad y la eficacia de los procedimientos lingüísticos empleados.","ce":"CE4","block":"CE4 · Comprensión escrita y multimodal","ceDescription":"Comprensión escrita y multimodal","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Examina quién escribe un texto, con qué intención y si sus argumentos y datos resultan fiables.","levels":["No entrega las actividades de análisis crítico de fuentes y textos escritos.","Acepta el texto de manera pasiva y crédula; no cuestiona la procedencia, confunde hechos objetivos con opiniones y no examina la intención.","Comprueba si la fuente parece oficial o creíble con pautas sencillas y detecta inconsistencias argumentativas muy evidentes.","Evalúa de forma razonada la calidad y fiabilidad del texto escrito, identificando la solidez de los argumentos y el registro lingüístico empleado.","Desmonta con criterio experto manipulaciones, datos sesgados o propaganda escrita; calibra la precisión de los recursos lingüísticos y sustenta su juicio con rigor."],"improvements":[["Analiza una fuente breve siguiendo tres preguntas sencillas."],["Distingue hechos y opiniones y comprueba de dónde procede la información."],["Compara al menos dos fuentes y justifica cuál resulta más fiable."],["Identifica sesgos o contradicciones y defiende una conclusión con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|5.1","number":"5.1","shortTitle":"Planificación, redacción de borradores y adecuación textual","title":"Planificar la redacción de textos escritos y multimodales atendiendo a la situación comunicativa, destinatario, propósito y canal; redactar borradores y revisarlos con ayuda del diálogo entre iguales e instrumentos de consulta; presentar un texto final coherente y adecuado.","ce":"CE5","block":"CE5 · Producción escrita","ceDescription":"Producción escrita","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Prepara un esquema, redacta un borrador, lo revisa y entrega un texto adecuado al destinatario.","levels":["No escribe ni entrega el producto o texto escrito solicitado.","Escribe directamente sin planificar ni hacer borrador; texto inconexo, con ideas desordenadas, mezcla inadecuada de registros y presentación descuidada.","Elabora un borrador elemental con plantilla o guía docente; el texto final transmite el mensaje y mantiene una estructura básica reconocible.","Planifica con esquema propio, revisa su borrador a partir de sugerencias y entrega un texto formal limpio, bien cohesionado y adaptado al destinatario.","Despliega un proceso riguroso de diseño, textualización y autoedición; el texto final destaca por su coherencia impecable, orden lógico y pulcritud de registro formal."],"improvements":[["Realiza una tarea breve de lectura, escritura o análisis lingüístico."],["Identifica la idea principal y revisa los errores con una pauta."],["Organiza y explica las ideas con autonomía y comprueba la corrección."],["Contrasta matices, revisa con precisión y justifica las elecciones realizadas."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|5.2","number":"5.2","shortTitle":"Cohesión, corrección ortográfica, gramatical y léxica","title":"Incorporar procedimientos para enriquecer los textos atendiendo a aspectos discursivos, lingüísticos y de estilo, con precisión léxica y corrección ortográfica y gramatical.","ce":"CE5","block":"CE5 · Producción escrita","ceDescription":"Producción escrita","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Escribe con claridad, utiliza conectores y revisa la ortografía, la gramática y el vocabulario.","levels":["No presenta ningún escrito evaluable para analizar su corrección formal.","Errores ortográficos y de concordancia masivos que dificultan gravemente la lectura; vocabulario paupérrimo, repeticiones continuas y sin signos de puntuación.","Cumple las normas ortográficas básicas (comete fallos en tildes o grafías dudosas sin llegar al bloqueo del sentido); emplea conectores comunes (*porque*, *pero*).","Redacta con corrección sintáctica y ortográfica sólida; utiliza puntuación adecuada, variedad de conectores lógicos y vocabulario formal preciso.","Demuestra un dominio lingüístico y estilístico sobresaliente; riqueza léxica, sintaxis compleja impecable, ausencia de faltas y puntuación que dota al texto de ritmo y claridad."],"improvements":[["Realiza una tarea breve de lectura, escritura o análisis lingüístico."],["Identifica la idea principal y revisa los errores con una pauta."],["Organiza y explica las ideas con autonomía y comprueba la corrección."],["Contrasta matices, revisa con precisión y justifica las elecciones realizadas."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|6.1","number":"6.1","shortTitle":"Búsqueda, contraste y selección de fuentes","title":"Localizar, seleccionar y contrastar información de fuentes diversas evaluando su fiabilidad y pertinencia; organizarla en esquemas propios y comunicarla respetando la propiedad intelectual.","ce":"CE6","block":"CE6 · Alfabetización informacional e investigación","ceDescription":"Alfabetización informacional e investigación","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Busca información en varias fuentes, comprueba su fiabilidad, la organiza y señala de dónde procede.","levels":["No busca información ni entrega esquemas o fuentes documentales.","Copia y pega fragmentos íntegros de la primera web que encuentra; utiliza fuentes no contrastadas o anónimas e ignora la autoría.","Selecciona información útil de dos o más fuentes guiadas, realiza un esquema básico con apoyo y cita de dónde ha obtenido los datos.","Busca de forma autónoma en fuentes fiables, contrasta los datos discrepantes, los sintetiza en esquemas personales y cita las referencias sin plagio.","Investiga con rigor heurístico; discrimina fuentes primarias y secundarias, detecta sesgos institucionales o comerciales y estructura la información en esquemas originales impecables."],"improvements":[["Analiza una fuente breve siguiendo tres preguntas sencillas."],["Distingue hechos y opiniones y comprueba de dónde procede la información."],["Compara al menos dos fuentes y justifica cuál resulta más fiable."],["Identifica sesgos o contradicciones y defiende una conclusión con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|6.2","number":"6.2","shortTitle":"Elaboración de trabajos de investigación","title":"Elaborar trabajos de investigación en diferentes soportes sobre diversos temas de interés a partir de la información seleccionada.","ce":"CE6","block":"CE6 · Alfabetización informacional e investigación","ceDescription":"Alfabetización informacional e investigación","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Elabora un trabajo con apartados claros, información seleccionada y conclusiones propias.","levels":["No entrega el trabajo de investigación ni el informe monográfico.","Presenta una recopilación desordenada y pegada de textos ajenos, carente de hilo conductor, conclusiones o análisis propio.","Elabora un trabajo sencillo estructurado en apartados básicos (introducción, desarrollo y conclusión) a partir de la información recopilada con guía.","Redacta un trabajo de investigación ordenado y personal, donde integra las fuentes consultadas aportando explicaciones coherentes y conclusiones propias.","Produce una investigación monográfica rigurosa, con aparato crítico de notas/citas, análisis comparativo profundo, redacción académica madura y conclusiones de alto valor."],"improvements":[["Analiza una fuente breve siguiendo tres preguntas sencillas."],["Distingue hechos y opiniones y comprueba de dónde procede la información."],["Compara al menos dos fuentes y justifica cuál resulta más fiable."],["Identifica sesgos o contradicciones y defiende una conclusión con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|6.3","number":"6.3","shortTitle":"Uso crítico, seguro y saludable de entornos digitales","title":"Adoptar hábitos de uso crítico, seguro, sostenible y saludable de las tecnologías digitales en relación a la búsqueda y comunicación de información.","ce":"CE6","block":"CE6 · Alfabetización informacional e investigación","ceDescription":"Alfabetización informacional e investigación","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Utiliza herramientas digitales con seguridad, protege datos personales y se mantiene centrado en la tarea.","levels":["Muestra absentismo o rechazo absoluto a las normas de trabajo digital del aula.","Descarga archivos sin seguridad, vulnera la privacidad ajena, comparte bulos y usa los dispositivos para la distracción o conductas de riesgo.","Sigue las pautas de seguridad marcadas en el centro (gestión de contraseñas, respeto básico en redes y uso centrado en la tarea lectiva).","Aplica hábitos consolidados de seguridad digital; protege sus datos, respeta la etiqueta digital y desconecta los dispositivos para evitar distracciones.","Promueve activamente la ciberseguridad y la salud digital; detecta riesgos de malware o estafa, previene el acoso en red y reflexiona sobre el impacto del consumo tecnológico."],"improvements":[["Realiza la actividad básica con una pauta clara."],["Identifica los errores principales y corrígelos con un ejemplo."],["Repite la tarea de forma autónoma y explica por qué has elegido esa solución."],["Compara dos ejemplos y justifica tu respuesta con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|7.1","number":"7.1","shortTitle":"Construcción del itinerario lector propio","title":"Leer de manera autónoma textos seleccionados en función de los propios gustos e intereses, y dejar constancia del progreso del itinerario lector explicando criterios de selección y experiencia.","ce":"CE7","block":"CE7 · Lectura autónoma y perfil lector","ceDescription":"Lectura autónoma y perfil lector","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Selecciona lecturas por interés propio, avanza en ellas y registra qué ha leído y por qué lo ha elegido.","levels":["No lee ninguna obra voluntaria ni cumplimenta el diario/ficha de lectura.","Abandona las lecturas en las primeras páginas o falsea fichas de lectura copiadas de internet sin leer el libro.","Completa la lectura de al menos una obra adaptada a su nivel, rellenando la ficha básica y explicando si le ha gustado o no.","Lee de forma continuada y autónoma, registra sus impresiones en su diario lector y argumenta con criterio qué temas o géneros prefiere.","Muestra un hábito lector consolidado; amplía su itinerario explorando nuevos géneros y reflexiona con madurez sobre su propia evolución como lector."],"improvements":[["Realiza la actividad básica con una pauta clara."],["Identifica los errores principales y corrígelos con un ejemplo."],["Repite la tarea de forma autónoma y explica por qué has elegido esa solución."],["Compara dos ejemplos y justifica tu respuesta con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|7.2","number":"7.2","shortTitle":"Compartir la experiencia lectora y biográfica","title":"Compartir la experiencia de lectura en soportes diversos relacionando el sentido de la obra con la propia experiencia biográfica, lectora y cultural.","ce":"CE7","block":"CE7 · Lectura autónoma y perfil lector","ceDescription":"Lectura autónoma y perfil lector","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Comenta una lectura explicando qué le ha parecido y cómo la relaciona con otras experiencias culturales.","levels":["No participa en los intercambios o tertulias literarias sobre libros leídos.","Incapaz de comentar el libro ante sus compañeros; se limita a decir «es aburrido» o «está bien» sin aportar ningún detalle de la trama.","Comparte un resumen elemental del argumento y formula una recomendación sencilla ante el grupo en soporte analógico u oral.","Expone su opinión razonada sobre el libro, relacionando situaciones de la historia leída con experiencias personales, noticias o temas sociales actuales.","Transmite el entusiasmo por la lectura con elocuencia; debate el sentido ético de la obra, establece vínculos vitales profundos e incita al debate crítico entre iguales."],"improvements":[["Realiza la actividad básica con una pauta clara."],["Identifica los errores principales y corrígelos con un ejemplo."],["Repite la tarea de forma autónoma y explica por qué has elegido esa solución."],["Compara dos ejemplos y justifica tu respuesta con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|8.1","number":"8.1","shortTitle":"Contexto sociohistórico y análisis de la obra literaria","title":"Explicar y argumentar la interpretación de las obras leídas a partir del análisis de las relaciones internas de sus elementos con el sentido de la obra y de sus relaciones externas con el contexto sociohistórico y géneros.","ce":"CE8","block":"CE8 · Educación literaria","ceDescription":"Educación literaria","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Explica de qué trata una obra literaria y cómo se relaciona con su época, sus personajes y su género.","levels":["No realiza los comentarios de texto literario ni responde a las preguntas contextuales.","Trata el texto literario como algo abstracto y aislado; desconoce la época, el autor y los conflictos humanos e históricos que refleja.","Reconoce el género básico (teatro, poesía, narrativa) y ubica la obra en su época histórica elemental tras el modelado del profesor.","Explica cómo influye la época histórica y social en la trama y en los personajes, identificando temas universales y recursos de género.","Desmenuza el texto literario con mirada crítica y rigurosa; vincula la forma estética con la realidad material e ideológica del momento histórico y analiza el conflicto moral."],"improvements":[["Completa una actividad breve de ordenación o contextualización."],["Sitúa los datos esenciales y revisa los errores de época o contexto."],["Explica las relaciones históricas con un ejemplo propio y sin plantilla."],["Contrasta otro caso y justifica la interpretación con datos concretos."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|8.2","number":"8.2","shortTitle":"Vínculos entre literatura, arte y problemáticas actuales","title":"Establecer vínculos argumentados entre los textos leídos y otros textos, manifestaciones artísticas y valores éticos y estéticos, mostrando la implicación personal.","ce":"CE8","block":"CE8 · Educación literaria","ceDescription":"Educación literaria","subject":"Lengua Castellana y Literatura","course":"4.º PDC","explanation":"Encuentra relaciones entre una obra literaria y otras obras, canciones, películas o problemas actuales.","levels":["No realiza las actividades comparativas entre textos y manifestaciones culturales.","Incapaz de encontrar conexiones; considera que las historias antiguas o clásicas no tienen relación alguna con el presente o el cine/música actual.","Asocia el argumento o tema central de la obra con una película, serie o canción actual cuando se le propone un ejemplo semejante.","Compara de forma autónoma motivos y valores éticos de la obra literaria con obras plásticas, musicales o problemas de la sociedad actual.","Establece analogías culturales complejas e innovadoras; debate la vigencia de arquetipos y dilemas morales en la cultura contemporánea con gran juicio crítico."],"improvements":[["Realiza la actividad básica con una pauta clara."],["Identifica los errores principales y corrígelos con un ejemplo."],["Repite la tarea de forma autónoma y explica por qué has elegido esa solución."],["Compara dos ejemplos y justifica tu respuesta con evidencias."],[]],"isBundledDefault":true},{"key":"Lengua Castellana y Literatura|4PDC|8.3","number":"8.3","shortTitle":"Creación de textos con intención literaria","title":"Crear textos personales o colectivos con intención literaria y conciencia de estilo a partir de la lectura de obras o modelos dados.","ce":"CE8","block":"CE8 · Educación literaria","ceDescription":"Educación literaria","subject":"Lengua Castellana y Literatura","cour function seedDefaultRubrics(target){
  // Se ejecuta una sola vez por clave; una rúbrica borrada a propósito no reaparece al recargar.
  const tracked=new Set(Array.isArray(target.builtinCatalogKeys)?target.builtinCatalogKeys:[]);
  let added=0,upgraded=0;
  for(const r of BUILTIN_4PDC){
    let existing=target.library.find(c=>c.bundledKey===r.key)
      ||target.library.find(c=>c.subject===r.subject&&c.course===r.course&&c.number===r.number);
    if(!existing&&!tracked.has(r.key)){
      // Migración de las dos rúbricas de demostración de las versiones anteriores.
      if(r.subject==='Lengua Castellana y Literatura'&&['1.1','1.2'].includes(r.number)){
        existing=target.library.find(c=>{const proto=sampleDB().library.find(p=>p.number===c.number);return !c.subject&&c.number===r.number&&String(c.block||'').includes('Multilingüismo')&&proto&&c.title===proto.title&&c.explanation===proto.explanation&&JSON.stringify(c.levels)===JSON.stringify(proto.levels)&&JSON.stringify(c.improvements)===JSON.stringify(proto.improvements)});
        if(existing){Object.assign(existing,r,{id:existing.id,bundledKey:r.key});upgraded++}
      }
      if(!existing){
        const fresh={...r,id:'builtin_4pdc_'+(r.subject==='Historia'?'his_':'len_')+r.number.replace('.','_'),bundledKey:r.key};
        target.library.push(fresh);existing=fresh;added++;
      }
    }
    if(existing&&!existing.bundledKey&&existing.isBundledDefault)existing.bundledKey=r.key;
    tracked.add(r.key);
  }
  target.builtinCatalogKeys=[...tracked];
  // Únicamente para el grupo de demostración, presentamos las dos materias ya configuradas.
  for(const g of target.groups){
    if(g.name==='4.º PDC · Grupo de ejemplo'&&!g.subjects.some(s=>/historia/i.test(s.name))){
      g.subjects.push({id:id(),name:'Geografía e Historia',criteriaIds:[],instruments:[],grades:{},observations:{}});
    }
    if(!/4\.?º?\s*PDC/i.test(g.name))continue;
    for(const sub of g.subjects){
      const matches=target.library.filter(c=>c.course==='4.º PDC'&&isSubjectMatch(c.subject,sub.name));
      if(matches.length)sub.criteriaIds=[...new Set([...sub.criteriaIds,...matches.map(c=>c.id)])];
    }
  }
  return {added,upgraded};
}
function isSubjectMatch(source,name){
  const n=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(source==='Historia')return /historia|geografia/.test(n);
  if(source==='Lengua Castellana y Literatura')return /lengua|literatura/.test(n);
  return false;
}
function relevantCriterion(c){
  const sub=currentSubject(),g=currentGroup();
  if(!c.subject)return true;
  if(!g||!/4\.?º?\s*PDC/i.test(g.name))return true;
  return isSubjectMatch(c.subject,sub?.name);
}

function instrumentsFor(subject,period,simulate=true){

 if(g&&s){const values=g.students.map(st=>result(s,st.id)).filter(x=>x!=null),initial=g.students.map(st=>result(s,st.id,0)).filter(x=>x!=null),stats=competencyStats(g,s,'all');html+=`<div class="grid three"><div class="panel metric"><div class="name">Media provisional · ${e(s.name)}</div><div class="value">${fmt(mean(values))}</div><small>Media de las notas individuales calculadas por criterios</small></div><div class="panel metric"><div class="name">Alumnado con evidencias</div><div class="value">${values.length}<small style="display:inline;font-size:15px"> / ${g.students.length}</small></div><small>No se incluyen estudiantes sin evaluar</small></div><div class="panel metric"><div class="name">Instrumentos de la materia</div><div class="value">${s.instruments.length}</div><small>${s.instruments.filter(i=>i.excluded).length} excluidos del cálculo</small></div></div>`;
 html+=`<div class="grid two" style="margin-top:16px"><section class="panel"><div class="section-head"><h2>Perfil del grupo</h2>${button('Abrir análisis →','go-analytics','','btn small')}</div><div class="chartbox">${radarSVG(stats,competencyStats(g,s,0))}</div><div class="chartlegend"><span><i class="legenddot" style="background:#477da0"></i>Actual</span><span><i class="legenddot" style="background:#d69b48"></i>Inicial (si hay datos)</span></div><p class="hint" style="margin-top:10px">Comparación por competencias específicas. La evaluación inicial no computa en la media.</p></section><section class="panel"><div class="section-head"><h2>Sugerencias docentes</h2><span class="tag blue">Diagnóstico · Intervención · Comprobación</span></div>${suggestionsHTML(g,s,'all',true)}</section></div>`;
 }else{html+=`<div class="callout">Selecciona un grupo y una materia para ver el análisis competencial. Las rúbricas pueden reutilizarse desde la biblioteca.</div>`}
 html+=`<div class="panel" style="margin-top:16px"><div class="section-head"><h2>Acciones rápidas</h2></div><div class="actions">${button('Añadir alumnado','students')}${button('Crear instrumento','new-instrument')}${button('Añadir criterios','assign-criteria')}${button('Biblioteca de rúbricas','nav','data-value="library"')}</div></div>`;return html;
}
function renderNotebook(){const g=currentGroup(),s=currentSubject();let html=pageTitle('Cuaderno de evaluación','Selecciona la evaluación, pulsa sobre una celda y evalúa desde el panel lateral.',button('＋ Instrumento','new-instrument','','btn primary')+button('＋ Alumnado','students'))+scopeSelectors();
 if(!g)return html+`<div class="empty panel">Crea un grupo para empezar.</div>`;
 if(!s)return html+`<div class="empty panel">Este grupo aún no tiene materias. ${button('Crear materia','new-subject','','btn primary')}</div>`;
 html+=`<div class="tabs" role="tablist" aria-label="Evaluaciones">${PERIODS.map((p,i)=>`<button type="button" role="tab" aria-selected="${state.period===i}" data-action="period" data-period="${i}" class="${state.period===i?'active':''}">${p}</button>`).join('')}</div>`;
 if(state.simOn)html+=`<div class="banner">Modo simulación activo: las calificaciones mostradas son hipotéticas. No se modifican las notas guardadas. ${button('Salir de simulación','stop-sim','','btn small')}</div>`;
 const instruments=s.instruments.filter(i=>state.period===4?i.period>=1:i.period===state.period); const active=instruments.filter(i=>!i.excluded);const pupils=g.students.filter(st=>{const scr=result(s,st.id,state.period===4?'all':state.period);return st.name.toLocaleLowerCase('es').includes(state.search.toLocaleLowerCase('es'))&&matchesGrade(scr,state.filter)}).sort((a,b)=>state.sort==='name'?byName(a,b):state.sort==='desc'?((result(s,b.id,state.period===4?'all':state.period)??-1)-(result(s,a.id,state.period===4?'all':state.period)??-1)):((result(s,a.id,state.period===4?'all':state.period)??999)-(result(s,b.id,state.period===4?'all':state.period)??999)));
 html+=`<div class="panel"><div class="section-head"><div><h2>${PERIODS[state.period]}</h2><p class="hint">${state.period===0?'Diagnóstica: no se incluye en la nota final.':state.period===4?'Vista acumulada de todas las evidencias de las tres evaluaciones.':'Nota trimestral calculada por criterios de la evaluación activa.'}</p></div><div class="actions">${button('Simular notas','open-sim','','btn small')}${button('Gestionar instrumentos','manage-instruments','','btn small')}${button('Asignar criterios','assign-criteria','','btn small')}</div></div>
 <div class="toolbar"><div class="field" style="max-width:265px"><label>Buscar alumnado</label><input class="search" id="student-search" placeholder="Nombre o apellido" value="${e(state.search)}"></div><div class="field" style="max-width:182px"><label>Mostrar</label><select id="grade-filter"><option value="all" ${state.filter==='all'?'selected':''}>Todo el alumnado</option><option value="pending" ${state.filter==='pending'?'selected':''}>Sin evaluar</option><option value="fail" ${state.filter==='fail'?'selected':''}>Nota inferior a 5</option><option value="pass" ${state.filter==='pass'?'selected':''}>Nota igual o superior a 5</option></select></div><div class="field" style="max-width:202px"><label>Ordenar</label><select id="sort"><option value="name" ${state.sort==='name'?'selected':''}>Nombre (A–Z)</option><option value="desc" ${state.sort==='desc'?'selected':''}>Nota (mayor a menor)</option><option value="asc" ${state.sort==='asc'?'selected':''}>Nota (menor a mayor)</option></select></div></div>
 <div class="tablebox"><table class="data-table"><thead><tr><th class="sticky-student">Alumnado</th><th class="sticky-final">Nota final<br><small>Acumulada</small></th><th class="sticky-term">${state.period===4?'Criterios':'Nota periodo'}<br><small>${state.period===0?'Diagnóstico':state.period===4?'Evaluados':'Provisional'}</small></th>${instruments.map(i=>`<th><div class="instlabel ${i.excluded?'dim':''}" style="background:${e(i.color)}">${e(i.name)}</div>${i.excluded?'<div class="hint">Excluido</div>':''}${state.simOn&&state.sim.has(i.id)?'<div class="hint">En simulación: excluido</div>':''}</th>`).join('')}</tr></thead><tbody>`;
 for(const st of pupils){const final=result(s,st.id,'all'),term=result(s,st.id,state.period===4?'all':state.period);html+=`<tr><td class="sticky-student"><button type="button" class="name-edit" data-action="edit-student" data-id="${e(st.id)}" title="Editar nombre de ${e(st.name)}">${e(st.name)} <span aria-hidden="true">✎</span></button></td><td class="sticky-final">${scoreHTML(final)}<div class="hint">Sugerida: ${guess(final)}</div></td><td class="sticky-term">${scoreHTML(term)}</td>${instruments.map(ins=>`<td><button type="button" class="cell ${ins.excluded?'dim':''}" data-action="evaluate" data-student="${e(st.id)}" data-id="${e(ins.id)}" title="Evaluar ${e(st.name)} · ${e(ins.name)}">${scoreHTML(instrumentResult(s,st.id,ins))}</button></td>`).join('')}</tr>`}
 html+=`</tbody></table></div><p class="hint" style="margin-top:12px">${pupils.length} estudiantes visibles · ${instruments.length} instrumentos. «—» significa sin evaluar. El 0 sí computa. ${state.period===4?'La nota final no es la media de los trimestres.':''}</p>`;
 if(!instruments.length)html+=`<div class="empty">No hay instrumentos en esta evaluación.${state.period!==4?'<div style="margin-top:12px">'+button('＋ Crear instrumento','new-instrument','','btn primary')+'</div>':' Cambia a un trimestre para crearlos.'}</div>`;
 html+=`</div>`;
 const missing=s.criteriaIds.filter(cid=>!getC(cid)).length;if(missing)html+=`<p class="hint">Atención: ${missing} rúbricas no están disponibles en la biblioteca.</p>`;return html;
}
function radarSVG(current,initial=[]){const cs=current.filter(x=>x.value!=null),initialMap=new Map(initial.map(x=>[x.ce,x.value]));const n=cs.length;if(n===0)return `<div class="empty">Aún no hay competencias evaluadas.</div>`;
 if(n<3)return `<div style="padding:20px 8px">${cs.map(x=>`<div style="margin-bottom:14px"><div class="between"><b>${e(x.ce)}</b><span>${fmt(x.value)} / 10</span></div><div style="height:10px;background:#eaf0f5;border-radius:8px;margin-top:6px"><div style="height:100%;background:#477da0;border-radius:8px;width:${x.value*10}%"></div></div></div>`).join('')}<p class="hint">El diagrama de araña aparecerá cuando existan al menos tres competencias con evidencias.</p></div>`;
 const cx=215,cy=160,r=109,p=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*(v/10)*Math.cos(a),cy+r*(v/10)*Math.sin(a)]};const pts=vs=>vs.map((v,i)=>p(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');let out=`<svg viewBox="0 0 430 320" role="img" aria-label="Perfil de competencias específicas">`;
 for(let t=2;t<=10;t+=2)out+=`<polygon points="${pts(Array(n).fill(t))}" fill="none" stroke="#dfe7ed" stroke-width="1"/>`;
 for(let i=0;i<n;i++){const [x,y]=p(i,10),[lx,ly]=p(i,12.3);out+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#dfe7ed"/><text x="${lx}" y="${ly+4}" font-size="12" font-weight="700" fill="#4d6073" text-anchor="middle">${e(cs[i].ce)}</text>`}
 if(cs.every(x=>initialMap.get(x.ce)!=null))out+=`<polygon points="${pts(cs.map(x=>initialMap.get(x.ce)))}" fill="#d69b48" fill-opacity=".07" stroke="#d69b48" stroke-width="2" stroke-dasharray="5 4"/>`;
 out+=`<polygon points="${pts(cs.map(x=>x.value))}" fill="#477da0" fill-opacity=".20" stroke="#477da0" stroke-width="2.5"/>`;cs.forEach((x,i)=>{const [x1,y1]=p(i,x.value);out+=`<circle cx="${x1}" cy="${y1}" r="3.5" fill="#477da0"><title>${e(x.ce)}: ${fmt(x.value)}</title></circle>`});return out+'</svg>';
}
function linesSVG(group,subject,studentId){const comps=competencyStats(group,subject,'all',studentId).map(x=>x.ce);if(!comps.length)return '<div class="empty">Sin competencias asociadas.</div>';const periodData=[0,1,2,3].map(p=>new Map(competencyStats(group,subject,p,studentId).map(x=>[x.ce,x.value])));const palette=['#477da0','#b57736','#468877','#8c659d','#a65959','#697b35','#466b9f'];const W=600,H=295,left=47,top=20,w=520,h=210;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de competencias por evaluación">`;
 for(let val=0;val<=10;val+=2){const y=top+h*(1-val/10);svg+=`<line x1="${left}" y1="${y}" x2="${left+w}" y2="${y}" stroke="#e1e8ee"/><text x="${left-10}" y="${y+4}" text-anchor="end" fill="#8190a0" font-size="11">${val}</text>`}
 [0,1,2,3].forEach(p=>{const x=left+w*p/3;svg+=`<text x="${x}" y="${top+h+24}" text-anchor="middle" font-size="11" fill="#64768a">${['Inicial','1.ª','2.ª','3.ª'][p]}</text>`});
 comps.forEach((ce,j)=>{const pts=[];const color=palette[j%palette.length];periodData.forEach((m,p)=>{let v=m.get(ce);if(v==null){if(pts.length){svg+=`<polyline points="${pts.join(' ')}" stroke="${color}" stroke-width="2.5" fill="none" stroke-linejoin="round"/>`;pts.length=0}return}let x=left+w*p/3,y=top+h*(1-v/10);pts.push(`${x},${y}`);svg+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${color}"><title>${e(ce)} · ${['Inicial','1.ª','2.ª','3.ª'][p]}: ${fmt(v)}</title></circle>`});if(pts.length)svg+=`<polyline points="${pts.join(' ')}" stroke="${color}" stroke-width="2.5" fill="none" stroke-linejoin="round"/>`});return svg+'</svg><div class="chartlegend">'+comps.map((ce,i)=>`<span><i class="legenddot" style="background:${palette[i%palette.length]}"></i>${e(ce)}</span>`).join('')+'</div>';
}
function suggestionFor(name){const s=name.toLowerCase();if(/lingü|lengu|acent|dialec/.test(s))return ['Compara dos ejemplos reales de uso lingüístico.','Identifica qué cambia y explica por qué, con una pregunta de apoyo.','Explica la diferencia sin ayuda y justifícala con un ejemplo.','Repite una comparación breve en el siguiente instrumento.'];if(/texto|lectur|comprend|fuente|histor/.test(s))return ['Lee una fuente breve y localiza dos ideas esenciales.','Identifica una idea con una pregunta guía.','Relaciona dos ideas de la fuente de forma autónoma.','Comprueba la mejora con otra fuente breve.'];if(/diálogo|diálogo|consenso|conflict|respeto/.test(s))return ['Plantea un desacuerdo cotidiano para resolverlo en parejas.','Escucha las opiniones del resto y formula una pregunta.','Propón una solución razonada sin ayuda.','Observa el desempeño en el siguiente debate.'];return ['Trabaja un ejemplo breve vinculado al criterio.','Resuelve el ejemplo con una pauta visible.','Repite la misma tarea sin la pauta y justifica la respuesta.','Comprueba la mejora en el siguiente instrumento que evalúe el criterio.']}
function suggestionsHTML(group,subject,period='all',compact=false){const stats=competencyStats(group,subject,period).filter(x=>x.value!=null);if(!stats.length)return `<p class="muted">Todavía no hay datos para proponer mejoras. Registra evaluaciones y aparecerán sugerencias vinculadas a las competencias.</p>`;
 const weak=stats.filter(x=>x.covered>=Math.min(3,group.students.length)&&x.value<6).sort((a,b)=>a.value-b.value).slice(0,compact?2:5);if(!weak.length)return `<p class="muted">No se detectan competencias con media inferior a 6 y cobertura suficiente. Continúa recogiendo evidencias y revisa los casos individuales.</p>`;
 return weak.map(x=>{const c=x.criteria.map(cid=>getC(cid)).find(Boolean);const [inter,ref,ind,check]=suggestionFor(c?.title||x.ce);return `<div class="recommend"><div class="between"><h3>${e(x.ce)} · ${e(c?.number||'')}</h3>${scoreHTML(x.value)}</div><div class="hint">${x.covered} de ${x.total} estudiantes con evidencias · Diagnóstico: nivel medio bajo</div><p style="margin-top:7px"><b>Intervención (10–15 min):</b> ${e(inter)}</p>${compact?`<p class="hint" style="margin-top:5px"><b>Comprobación:</b> ${e(check)}</p>`:`<div class="action"><b>Misma actividad, tres apoyos:</b><br>Refuerzo: ${e(ref)}<br>Consolidación: ${e(ind)}<br>Ampliación: justifica la respuesta y contrasta otro ejemplo.</div><p style="margin-top:8px"><b>Comprobación:</b> ${e(check)}</p>`}</div>`}).join('')}
function renderAnalytics(){const g=currentGroup(),s=currentSubject();let html=pageTitle('Análisis competencial','Evalúa el progreso individual y el del grupo, sin confundir datos pendientes con ceros.')+scopeSelectors();if(!g||!s)return html+'<div class="empty panel">Selecciona un grupo y una materia.</div>';
 const sub=state.analysisStudent==='group'?'group':g.students.some(x=>x.id===state.analysisStudent)?state.analysisStudent:'group',per=state.analysisPeriod;const stats=competencyStats(g,s,per===4?'all':per,sub),initial=competencyStats(g,s,0,sub);
 html+=`<div class="panel"><div class="toolbar"><div class="field" style="max-width:280px"><label>Analizar</label><select id="analysis-student"><option value="group">Grupo completo</option>${g.students.map(st=>`<option value="${e(st.id)}" ${sub===st.id?'selected':''}>${e(st.name)}</option>`).join('')}</select></div><div class="field" style="max-width:210px"><label>Evaluación</label><select id="analysis-period">${PERIODS.map((p,i)=>`<option value="${i}" ${per===i?'selected':''}>${e(p)}</option>`).join('')}</select></div><div class="field" style="max-width:200px"><label>Visualización</label><select id="analysis-chart"><option value="radar" ${state.chart==='radar'?'selected':''}>Diagrama de araña</option><option value="lines" ${state.chart==='lines'?'selected':''}>Evolución temporal</option></select></div></div><div class="chartbox" style="max-width:680px;margin:auto">${state.chart==='radar'?radarSVG(stats,per===0?[]:initial):linesSVG(g,s,sub)}</div><p class="hint" style="text-align:center">La comparación inicial sólo aparece cuando existen datos de las mismas competencias. La evaluación inicial no cuenta para la nota final.</p></div>`;
 html+=`<div class="grid two" style="margin-top:16px"><div class="panel"><div class="section-head"><h2>Resultados por competencia</h2></div>${stats.map(x=>`<div class="between" style="padding:9px 0;border-bottom:1px solid #e8edf2"><div><b>${e(x.ce)}</b><div class="hint">Cobertura: ${x.covered} / ${x.total}</div></div>${scoreHTML(x.value)}</div>`).join('')||'<p class="muted">Sin resultados.</p>'}</div><div class="panel"><div class="section-head"><h2>Mejoras realistas para el grupo</h2></div>${sub==='group'?suggestionsHTML(g,s,per===0?0:per===4?'all':per):`<p class="muted">Selecciona «Grupo completo» para recibir sugerencias docentes multinivel. Los informes individuales contienen recomendaciones personalizadas.</p>`}</div></div>`;return html;
}
function renderLibrary(){const s=currentSubject();const filtered=db.library.filter(c=>(state.libSubject==='all'||(state.libSubject==='custom'?!c.subject:c.subject===state.libSubject))&&[c.number,c.shortTitle,c.title,c.ce,c.subject].join(' ').toLowerCase().includes(state.libSearch.toLowerCase()));let html=pageTitle('Biblioteca de rúbricas','Crea, importa, reutiliza y edita los criterios que utilizarás en tus instrumentos.',button('＋ Crear rúbrica','new-rubric','','btn primary')+button('Pegar criterios','bulk-rubric')+button('Importar rúbricas JSON','choose-rubric-import'))+scopeSelectors();html+=`<div class="panel"><div class="toolbar"><div class="field"><label>Buscar rúbricas</label><input id="lib-search" class="search" placeholder="Código, enunciado, competencia..." value="${e(state.libSearch)}"></div><div class="field" style="max-width:260px"><label>Filtrar biblioteca</label><select id="lib-subject"><option value="all" ${state.libSubject==='all'?'selected':''}>Todas las materias</option><option value="Historia" ${state.libSubject==='Historia'?'selected':''}>Historia · 4.º PDC</option><option value="Lengua Castellana y Literatura" ${state.libSubject==='Lengua Castellana y Literatura'?'selected':''}>Lengua · 4.º PDC</option><option value="custom" ${state.libSubject==='custom'?'selected':''}>Rúbricas propias</option></select></div></div><div class="between" style="margin-bottom:12px"><small>${db.library.length} rúbricas disponibles · ${s?.criteriaIds.length||0} asociadas a esta materia</small>${button('Asignar a la materia','assign-criteria','','btn small')}</div>${[...new Set(filtered.map(c=>(c.subject?c.subject+' · ':'')+(c.block||'General')))].map(bl=>`<details open style="margin:14px 0"><summary style="font-size:15px;padding:10px 0;">${e(bl)} <span class="tag">${filtered.filter(c=>(c.subject?c.subject+' · ':'')+(c.block||'General')===bl).length} criterios</span></summary>${filtered.filter(c=>(c.subject?c.subject+' · ':'')+(c.block||'General')===bl).map(c=>`<artic function blankRubric(){return {id:'',number:'',title:'',ce:'CE1',block:'General',explanation:'',levels:["No realiza la actividad o no entrega la tarea.","Realiza un intento, pero presenta dificultades importantes.","Alcanza lo esencial con algunas ayudas.","Resuelve la tarea correctamente y de forma autónoma.","Demuestra dominio, precisión y capacidad de análisis."],improvements:[['Realiza una primera tarea guiada.'],['Revisa los errores más importantes y repite un ejemplo.'],['Completa la misma tarea con menos ayuda.'],['Añade una justificación y revisa el resultado.'],[]]};}
function generateRubric(number,title){const c=blankRubric(),lower=title.toLowerCase();let theme='el criterio';if(/comprensi|textos|lectur/.test(lower))theme='la comprensión de textos';else if(/lenguas|dialec|lingüís/.test(lower))theme='las lenguas y sus variedades';else if(/conflic|diálog|consenso/.test(lower))theme='la resolución dialogada';else if(/fuentes|históri/.test(lower))theme='el análisis de fuentes históricas';else if(/mapas|territor|geograf/.test(lower))theme='la interpretación geográfica';else if(/argument|escri/.test(lower))theme='la expresión y la argumentación';return {id:id(),number,title,ce:'CE'+number.split('.')[0],block:'General',subject:'',course:'',explanation:`En una actividad observable, comprueba cómo aplica ${theme} y si lo hace con ayuda o autonomía.`,levels:[`No realiza la tarea relacionada con ${theme} o no la entrega.`,`Intenta trabajar ${theme}, pero comete errores graves y no alcanza los mínimos.`,`Resuelve lo básico relacionado con ${theme}, aunque necesita pautas o ayuda.`,`Aplica ${theme} de forma correcta, ordenada y autónoma.`,`Demuestra dominio de ${theme}, con precisión, capacidad de contraste y argumentación.`],improvements:[['Realiza una tarea breve guiada sobre el criterio.'],['Identifica dos errores importantes y vuelve a intentarlo.'],['Repite la tarea con menos ayudas y explica tu respuesta.'],['Contrasta dos ejemplos y justifica tus decisiones.'],[]]};}
function parseBulk(text){const rows=text.split(/\r?\n/),items=[];for(let raw of rows){const line=raw.trim();if(!line)continue;const m=line.match(/^(\d+\.\d+)\s*[.\-–:]?\s+(.+)$/);if(m)items.push({number:m[1],title:m[2]});else if(items.length)items[items.length-1].title+=' '+line;}return items;}
