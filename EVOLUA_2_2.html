    for(const cid of removed)delete original.overrides?.[cid];
    for(const key of scored)delete s.grades[key];
  }else s.instruments.push({id:id(),name,period,type,color,criteriaIds:ids,overrides:{},excluded:false});
  s.criteriaIds=[...new Set([...s.criteriaIds,...ids])];state.period=period;state.page='notebook';state.modal=null;refresh();flash(`Instrumento «${name}» guardado. ${removed.length?'Criterios retirados: '+removed.length+'.':''}`);return;
 }
 if(m.kind==='assign'){if(!s)return;const ids=checked('subject-criterion'),used=s.instruments.flatMap(i=>i.criteriaIds);s.criteriaIds=[...new Set([...ids,...used])];state.modal=null;refresh();flash('Criterios de la materia guardados.');return}
 if(m.kind==='rubric'){const n=val('rub-number'),ce=val('rub-ce'),block=val('rub-block')||'General',title=val('rub-title'),explanation=val('rub-explain');if(!n||!ce||!title)return flash('Completa el código, la competencia y el enunciado.');const levels=BASE.map((_,i)=>val('rub-level-'+i)),improvements=BASE.map((_,i)=>i===4?[]:val('rub-improve-'+i).split('\n').map(x=>x.trim()).filter(Boolean));if(levels.some(x=>!x))return flash('Completa los cinco descriptores de logro.');const existing=m.data.id?getC(m.data.id):null,inst=m.data.instrumentId?getInst(m.data.instrumentId):null;
 if(inst){if(!existing)return flash('No se encuentra la rúbrica maestra.');const over={};for(const [field,value] of Object.entries({title,ce,block,explanation}))if(value!==existing[field])over[field]=value;
 for(const field of ['levels','improvements']){const ch={};const arr=field==='levels'?levels:improvements;for(let i=0;i<5;i++)if(JSON.stringify(arr[i])!==JSON.stringify(existing[field][i]))ch[i]=arr[i];if(Object.keys(ch).length)over[field]=ch;}if(Object.keys(over).length)inst.overrides[existing.id]=over;else delete inst.overrides[existing.id];
 }else if(existing)Object.assign(existing,{number:n,title,ce,block,explanation,levels,improvements});else db.library.push({id:id(),number:n,title,ce,block,explanation,levels,improvements,subject:isSubjectMatch('Historia',s?.name)?'Historia':isSubjectMatch('Lengua Castellana y Literatura',s?.name)?'Lengua Castellana y Literatura':'',course:/4\.?º?\s*PDC/i.test(g?.name||'')?'4.º PDC':''});
 state.modal=null;refresh();flash('Rúbrica guardada.');return}
 if(m.kind==='bulk'){const items=parseBulk(val('bulk-text'));if(!items.length)return flash('No se detectaron criterios. Usa el formato: 1.1. Enunciado.');let added=[],ignored=0;for(const item of items){if(db.library.some(c=>c.number===item.number&&c.title===item.title)){ignored++;continue}const rub=generateRubric(item.number,item.title);db.library.push(rub);added.push(rub.id)}if(document.getElementById('bulk-assign')?.checked&&s)s.criteriaIds=[...new Set([...s.criteriaIds,...added])];state.modal=null;state.page='library';refresh();flash(`${added.length} rúbricas creadas${ignored?' · '+ignored+' duplicadas omitidas':''}. Revisa sus descriptores.`);return}
 if(m.kind==='import'){const imp=state.pendingImport;if(!imp)return;const mode=checked('import-mode')[0]||'replace';if(mode==='replace'&&!confirm('¿Restaurar la copia? Se sustituirán los grupos y calificaciones actuales.'))return;
 try{db=mode==='replace'?validateImport(imp.data):mergeData(db,validateImport(imp.data));seedDefaultRubrics(db);state.year=db.years[0];state.groupId=db.groups[0]?.id||null;state.subjectId=null;state.modal=null;state.pendingImport=null;state.sim.clear();state.simOn=false;refresh();flash('Datos importados y guardados correctamente.')}catch(err){flash('Error al importar: '+err.message)}return}
}
function printableReportMarkup(){const title='Informe de evaluación · EVOLUA';const css=document.querySelector('head style')?.textContent||'';const doc=document.querySelector('#print-area .report-page')?.innerHTML||reportDocumentHTML();return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>${css}body{background:white!important}.report-page{box-shadow:none;border:0;max-width:900px;margin:auto;padding:25px}.print-area{display:block!important}@media print{@page{size:A4;margin:16mm}.report-page{padding:0!important}}</style></head><body><main class="report-page">${doc}</main></body></html>`;}
function reportFileName(){const g=currentGroup(),s=currentSubject(),r=state.report,st=g?.students.find(x=>x.id===r.studentId);const raw=`EVOLUA_${r.kind==='group'?'grupo_'+(g?.name||''):st?.name||'informe'}_${s?.name||''}`;return raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,100);}
function showPrintableReport(){const report=reportDocumentHTML();state.modal=null;state.drawer=null;document.getElementById('print-area').innerHTML=`<div class="print-controls"><div><b>Vista de impresión · EVOLUA</b><p>Comprueba el documento y pulsa «Imprimir / Guardar como PDF». En el diálogo del navegador elige «Guardar como PDF».</p></div><div class="actions">${button('← Volver','close-print-preview')}${button('Descargar HTML imprimible','download-printable-html')}${button('Imprimir / Guardar como PDF','send-to-printer','','btn primary')}</div></div><main class="report-page">${report}</main>`;document.body.classList.add('report-print-preview');renderPortal();window.scrollTo(0,0);}
function downloadPrintableReport(){if(!document.body.classList.contains('report-print-preview'))return flash('Abre primero la vista de impresión.');downloadBlob(printableReportMarkup(),reportFileName()+'.html','text/html;charset=utf-8');flash('Informe HTML descargado. Puedes abrirlo e imprimirlo como PDF.');}
function doClick(btn){const action=btn.dataset.action,value=btn.dataset.value,elemId=btn.dataset.id;const s=currentSubject(),g=currentGroup();switch(action){
 case'nav':state.page=value;state.modal=null;state.drawer=null;state.simOn=false;state.sim.clear();render();renderPortal();break;
 case'period':state.period=Number(btn.dataset.period);render();break;
 case'open-group':state.groupId=elemId;ensureSelection();state.page='notebook';render();break;
 case'go-analytics':state.page='analytics';render();break;
 case'edit-student':if(!g)return flash('Selecciona un grupo.');openModal('edit-student',{id:elemId});break;
 case'edit-group':if(!g)return flash('Selecciona un grupo.');openModal('edit-group');break;
 case'edit-subject':if(!s)return flash('Selecciona una materia.');openModal('edit-subject');break;
 case'edit-year':openModal('edit-year');break;
 case'new-group':openModal('group');break;
 case'new-subject':if(!g)return flash('Primero crea un grupo.');openModal('subject');break;
 case'new-year':openModal('year');break;
 case'students':if(!g)return flash('Primero crea un grupo.');openModal('students');break;
 case'new-instrument':if(!s)return flash('Primero crea o selecciona una materia.');openModal('instrument');break;
 case'edit-instrument':openModal('instrument',{id:elemId});break;
 case'uncheck-inst-criterion':{const input=document.querySelector(`input[name="instrument-criterion"][value="${elemId}"]`);if(input){input.checked=false;updateInstrumentCriteriaUI()}break}
 case'manage-instruments':if(!s)return flash('Selecciona una materia.');openModal('manage-instruments');break;
 case'assign-criteria':if(!s)return flash('Selecciona una materia.');openModal('assign');break;
 case'new-rubric':openModal('rubric');break;
 case'edit-rubric':openModal('rubric',{id:elemId});break;
 case'edit-inst-rubric':openModal('rubric',{id:elemId,instrumentId:btn.dataset.inst});break;
 case'bulk-rubric':openModal('bulk');break;
 case'cancel-modal':closeModal();break;
 case'save-modal':saveModal();break;
 case'close-drawer':state.drawer=null;renderPortal();break;
 case'evaluate':state.drawer={studentId:btn.dataset.student,instrumentId:elemId};renderPortal();break;
 case'drawer-next':case'drawer-prev':{if(!g||!state.drawer)return;const a=[...g.students].sort(byName),pos=a.findIndex(x=>x.id===state.drawer.studentId),next=a[pos+(action==='drawer-next'?1:-1)];if(next){state.drawer.studentId=next.id;renderPortal()}break}
 case'set-grade':{if(!state.drawer||!s)return;const n=Number(btn.dataset.score),cid=btn.dataset.cid;if(!Number.isInteger(n)||n<0||n>10)return;const key=fieldKey(state.drawer.studentId,state.drawer.instrumentId,cid);s.grades[key]=n;let scroll=document.querySelector('.drawer')?.scrollTop||0;refresh();const drawer=document.querySelector('.drawer');if(drawer)drawer.scrollTop=scroll;break}
 case'clear-grade':{if(!state.drawer||!s)return;delete s.grades[fieldKey(state.drawer.studentId,state.drawer.instrumentId,btn.dataset.cid)];let scroll=document.querySelector('.drawer')?.scrollTop||0;refresh();document.querySelector('.drawer').scrollTop=scroll;break}
 case'choose-color':{let col=document.getElementById('inst-color');if(col)col.value=btn.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x.dataset.color===btn.dataset.color));break}
 case'open-sim':openModal('simulate');break;
 case'save-simulation':{if(!s)return;const included=new Set([...document.querySelectorAll('input[name="sim-instrument"]:checked')].map(x=>x.value));state.sim=new Set(s.instruments.filter(i=>!i.excluded&&!included.has(i.id)).map(i=>i.id));state.simOn=state.sim.size>0;state.modal=null;render();renderPortal();flash(state.simOn?'Simulación aplicada. Las notas reales no han cambiado.':'Simulación desactivada.');break}
 case'clear-simulation':case'stop-sim':state.sim.clear();state.simOn=false;state.modal=null;render();renderPortal();break;
 case'delete-instrument':{const ins=getInst(elemId);if(!ins||!s)return;if(!confirm(`¿Eliminar «${ins.name}» y todas sus calificaciones? Esta acción no se puede deshacer.`))return;s.instruments=s.instruments.filter(i=>i.id!==elemId);for(const k of Object.keys(s.grades))if(k.split('::')[1]===elemId)delete s.grades[k];for(const k of Object.keys(s.observations))if(k.split('::')[1]===elemId)delete s.observations[k];state.sim.delete(elemId);state.modal=null;refresh();flash('Instrumento eliminado y medias recalculadas.');break}
 case'delete-student':{if(!g)return;const st=getStudent(elemId);if(!st||!confirm(`¿Eliminar a ${st.name} y sus calificaciones del grupo?`))return;g.students=g.students.filter(x=>x.id!==elemId);for(const sub of g.subjects){for(const k of Object.keys(sub.grades))if(k.startsWith(elemId+'::'))delete sub.grades[k];for(const k of Object.keys(sub.observations))if(k.startsWith(elemId+'::'))delete sub.observations[k]};state.modal=null;refresh();flash('Estudiante eliminado.');break}
 case'delete-rubric':{if(!getC(elemId))return flash('No se encuentra el criterio.');openModal('confirm-delete-rubric',{id:elemId});break}
 case'confirm-delete-rubric':{
  const cid=state.modal?.data?.id,crit=getC(cid);if(!crit)return flash('No se encuentra el criterio.');
  let impacted=0,affectedGrades=0;
  for(const group of db.groups)for(const sub of group.subjects){
    sub.criteriaIds=sub.criteriaIds.filter(x=>x!==cid);
    for(const ins of sub.instruments){if(ins.criteriaIds.includes(cid))impacted++;
      ins.criteriaIds=ins.criteriaIds.filter(x=>x!==cid);
      if(ins.overrides)delete ins.overrides[cid];
    }
    for(const key of Object.keys(sub.grades))if(key.split('::')[2]===cid){delete sub.grades[key];affectedGrades++}
  }
  if(crit.bundledKey){db.builtinCatalogKeys=[...new Set([...(db.builtinCatalogKeys||[]),crit.bundledKey])]}
  db.library=db.library.filter(c=>c.id!==cid);
  if(state.drawer)state.drawer=null;
  state.modal=null;refresh();flash(`Criterio eliminado. ${impacted} instrumentos y ${affectedGrades} calificaciones actualizados.`);break;
 }
 case'reset-override':{const ins=getInst(elemId);if(ins&&confirm('¿Restaurar la rúbrica maestra en este instrumento?')){delete ins.overrides[btn.dataset.cid];state.modal=null;refresh();flash('Se ha restaurado la versión maestra.')}break}
 case'backup':backup();break;
 case'choose-import':document.getElementById('import-input').click();break;
 case'choose-rubric-import':document.getElementById('rubric-import-input').click();break;
 case'export-csv':exportCSV();break;
 case'open-individual-report':startReport('student',document.getElementById('report-student-page')?.value);break;
 case'open-group-report':startReport('group');break;
 case'drawer-report':startReport('student',elemId);break;
 case'print-report':{if(!state.modal||state.modal.kind!=='report')return;db.reportDrafts[reportKey()]={...state.reportEdit};save();showPrintableReport();break}
 case'send-to-printer':{const area=document.getElementById('print-area');if(!area||!document.body.classList.contains('report-print-preview'))return flash('Primero abre la vista de impresión.');window.print();break}
 case'download-printable-html':downloadPrintableReport();break;
 case'close-print-preview':document.body.classList.remove('report-print-preview');document.getElementById('print-area').innerHTML='';state.modal=null;state.page='reports';render();renderPortal();break;
 default:break;
 }}
document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-action]');if(btn){ev.preventDefault();if(btn.disabled)return;try{doClick(btn)}catch(error){console.error(error);flash('No se pudo completar la acción: '+error.message)}}else if(ev.target.dataset.overlay==='modal')closeModal();else if(ev.target.dataset.overlay==='drawer'){state.drawer=null;renderPortal()}});
document.addEventListener('change',ev=>{const t=ev.target;try{
 if(t.id==='lib-subject'){state.libSubject=t.value;render();return}
 if(t.id==='choose-year'){state.year=t.value;state.groupId=null;state.subjectId=null;state.drawer=null;state.simOn=false;state.sim.clear();render();return}
 if(t.id==='choose-group'){state.groupId=t.value;state.subjectId=null;state.drawer=null;state.simOn=false;state.sim.clear();render();return}
 if(t.id==='choose-subject'){state.subjectId=t.value;state.drawer=null;state.simOn=false;state.sim.clear();render();return}
 if(t.name==='instrument-criterion'||t.id==='show-all-criteria'){updateInstrumentCriteriaUI();return}
 if(t.id==='grade-filter'){state.filter=t.value;render();return}if(t.id==='sort'){state.sort=t.value;render();return}
 if(t.id==='analysis-student'){state.analysisStudent=t.value;render();return}if(t.id==='analysis-period'){state.analysisPeriod=Number(t.value);render();return}if(t.id==='analysis-chart'){state.chart=t.value;render();return}
 if(t.dataset.change==='persist-exclude'){const ins=getInst(t.dataset.id);if(ins){ins.excluded=t.checked;refresh();flash(ins.excluded?'Instrumento excluido del cálculo.':'Instrumento incluido de nuevo en el cálculo.')}return}
 if(t.dataset.change==='observation'){const s=currentSubject();if(s){s.observations[obsKey(t.dataset.student,t.dataset.inst)]=t.value;save();flash('Observación guardada.')}return}
 if(t.id==='report-period'){state.report.period=t.value==='all'?'all':Number(t.value);switchReportControls();return}
 if(t.id==='report-audience'){state.report.audience=t.value;switchReportControls();return}
 if(t.id==='report-student'){state.report.studentId=t.value;switchReportControls();return}
 if(t.dataset.reportField){const key=t.dataset.reportField;state.reportEdit[key]=t.type==='checkbox'?t.checked:t.value;db.reportDrafts[reportKey()]={...state.reportEdit};save();const preview=document.getElementById('report-preview');if(preview)preview.innerHTML=reportDocumentHTML();return}
 if(t.id==='import-input'){const file=t.files?.[0];t.value='';if(!file)return;file.text().then(txt=>{try{const parsed=validateImport(JSON.parse(txt));state.pendingImport={fileName:file.name,data:parsed};openModal('import')}catch(error){flash('No se pudo abrir el archivo: '+error.message)}}).catch(err=>flash('No se pudo leer el archivo: '+err.message));return}
 if(t.id==='rubric-import-input'){const file=t.files?.[0];t.value='';if(!file)return;file.text().then(txt=>{try{const res=importRubricJSON(JSON.parse(txt));flash(res+' rúbricas importadas o actualizadas.')}catch(error){flash('Error en rúbricas JSON: '+error.message)}}).catch(err=>flash('Error de lectura: '+err.message));return}
 }catch(err){console.error(err);flash('Error: '+err.message)}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='instrument-criterion-search'){updateInstrumentCriteriaUI();return}if(t.id==='student-search'||t.id==='lib-search'){const start=t.selectionStart??t.value.length,key=t.id==='student-search'?'search':'libSearch';state[key]=t.value;render();const fresh=document.getElementById(t.id);fresh?.focus();fresh?.setSelectionRange(start,start)}if(t.dataset.reportField&&t.type==='textarea'){state.reportEdit[t.dataset.reportField]=t.value;const preview=document.getElementById('report-preview');if(preview)preview.innerHTML=reportDocumentHTML();}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(state.modal)closeModal();else if(state.drawer){state.drawer=null;renderPortal()}}});
// Render once; store starter example immediately so the first reload preserves it.
try{if(!localStorage.getItem(STORE)||SEED_RESULT.added||SEED_RESULT.upgraded)save()}catch(_){state.saveOK=false};render();renderPortal();
